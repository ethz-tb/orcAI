[build-system]
requires = ["uv_build>=0.9.3,<0.10.0"]
build-backend = "uv_build"

[project]
name = "orcai"
version = "2.1.3"
authors = [
    { name = "Chérine Baumgartner", email = "cherine.baumgartner@env.ethz.ch" },
    { name = "Sebastian Bonhoeffer", email = "sebastian.bonhoeffer@env.ethz.ch" },
    { name = "Nicholas Ochsner", email = "nicolas.ochsner@env.ethz.ch" },
    { name = "Daniel Angst", email = "daniel.angst@env.ethz.ch" },
]
description = "A software package to detect acoustic signals in spectrograms generated from audio recordings. https://doi.org/10.1111/mms.70083 "
keywords = [
    "Bioacoustics",
    "Orca",
    "classification",
]
readme = "README.md"
requires-python = "==3.10.*"
license = "CC-BY-SA-4.0"
license-files = ["LICENSE"]
dependencies = [
    "zarr<4",
    "numpy<3",
    "pandas<3",
    "tensorflow[and-cuda]<3; sys_platform=='linux'",
    "tensorflow-macos; sys_platform=='darwin'",
    "tensorflow<3; sys_platform=='win32'",
    "keras_tuner <2",
    "keras<4",
    "librosa<1",
    "psutil<8",
    "rich-click<2",
    "humanize<5",
    "tqdm<5",
]

[project.urls]
Repository = "https://github.com/ethz-tb/orcAI"

[project.scripts]
orcai = "orcai.cli:cli"

[tool.setuptools.package-data]
"orcai.defaults" = ["*.json"]
"orcai.models" = ["*.*", "*/*.*"]

[dependency-groups]
dev = [
    "ipython>=9.2.0",
    "pytest>=8.4.1",
    "ruff>=0.12.8",
]
