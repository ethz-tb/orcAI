repos:
  - repo: local
    hooks:
      - id: just-lint
        name: just lint
        entry: just
        args: [lint]
        language: system
        stages: [pre-commit]
        types: [file, python]
        pass_filenames: true

      - id: just-test
        name: just test
        entry: just test
        language: system
        stages: [pre-push]
        pass_filenames: false
